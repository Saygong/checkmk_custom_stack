#version: '3.9'

networks:
  backend:
    driver: bridge

services:
  checkmk_app:
    image: checkmk/check-mk-community:${CHECKMK_VERSION}
    container_name: checkmk_app
    restart: unless-stopped
    environment:
      - CMK_PASSWORD=${CMK_DEFAULT_USER_PASSWORD}
      - TZ=Europe/Berlin
      - CMK_SITE_ID=${CMK_SITE_ID}
      - MAIL_RELAY_HOST=${MAIL_RELAY_HOST}
    #ports:
      #- 8080:5000 #Webserver
      #- 8000:8000 #AgentReceiver
    volumes:
      - ./checkmk/monitoring:/omd/sites
    tmpfs:
      - /opt/omd/sites/cmk/tmp:uid=1000,gid=1000
    networks:
      - backend

  checkmk_proxy:
    image: nginx:${PROXY_VERSION_TAG:-alpine}
    container_name: checkmk_proxy
    restart: unless-stopped
    ports:
      - "${PROXY_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - checkmk_app
    networks:
      - backend