#version: '3.9'

networks:
  backend:
    driver: bridge

services:
  checkmk_proxy:
    image: nginx:${PROXY_VERSION_TAG:-alpine}
    container_name: cmk_proxy
    restart: unless-stopped
    ports:
      - "${PROXY_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/logs:/var/log/nginx
    networks:
      - backend
      
      
  site_1:
    image: checkmk/check-mk-community:${CMK_VERSION}
    container_name: ${CMK_SITE_ID_1}
    restart: unless-stopped
    environment:
      - CMK_PASSWORD=${CMK_DEFAULT_USER_PWD_SITE_1}
      - TZ=Europe/Berlin
      - CMK_SITE_ID=${CMK_SITE_ID_1}
      - MAIL_RELAY_HOST=${MAIL_RELAY_HOST}
    #ports:
    #  - 8080:5000 #Webserver
    #  - 8000:8000 #AgentReceiver
    volumes:
      - volume_site_1:/omd/sites
      - ./checkmk/backups:/backups
    tmpfs:
      - /opt/omd/sites/${CMK_SITE_ID_1}/tmp:uid=1000,gid=1000
    networks:
      - backend

  site_2:
    image: checkmk/check-mk-community:${CMK_VERSION}
    container_name: ${CMK_SITE_ID_2}
    restart: unless-stopped
    environment:
      - CMK_PASSWORD=${CMK_DEFAULT_USER_PWD_SITE_2}
      - TZ=Europe/Berlin
      - CMK_SITE_ID=${CMK_SITE_ID_2}
      - MAIL_RELAY_HOST=${MAIL_RELAY_HOST}
      - CMK_LIVESTATUS_TCP=${LIVESTATUS_TCP_SWITCH}
    volumes:
      - volume_site_2:/omd/sites
      - ./checkmk/backups:/backups
    tmpfs:
      - /opt/omd/sites/${CMK_SITE_ID_2}/tmp:uid=1000,gid=1000
    networks:
      - backend


  site_3:
    image: checkmk/check-mk-community:${CMK_VERSION}
    container_name: ${CMK_SITE_ID_3}
    restart: unless-stopped
    environment:
      - CMK_PASSWORD=${CMK_DEFAULT_USER_PWD_SITE_3}
      - TZ=Europe/Berlin
      - CMK_SITE_ID=${CMK_SITE_ID_3}
      - MAIL_RELAY_HOST=${MAIL_RELAY_HOST}
      - CMK_LIVESTATUS_TCP=${LIVESTATUS_TCP_SWITCH}
    volumes:
      - volume_site_3:/omd/sites
      - ./checkmk/backups:/backups
    tmpfs:
      - /opt/omd/sites/${CMK_SITE_ID_3}/tmp:uid=1000,gid=1000
    networks:
      - backend


# Necessario creare un named volume -> bind mount non disponibile a causa di presenza di file socket trattati diversamente tra Linux e Windows
volumes:
  volume_site_1:
    name: ${VOLUME_NAME_SITE_1}
  volume_site_2:
    name: ${VOLUME_NAME_SITE_2}
  volume_site_3:
    name: ${VOLUME_NAME_SITE_3}
