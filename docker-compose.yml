#version: '3.9'

networks:
  backend:
    driver: bridge

services:
  checkmk_app:
    image: checkmk/check-mk-community:${CMK_VERSION}
    container_name: checkmk_app
    restart: unless-stopped
    environment:
      - CMK_PASSWORD=${CMK_DEFAULT_USER_PASSWORD}
      - TZ=Europe/Berlin
      - CMK_SITE_ID=${CMK_SITE_ID}
      - MAIL_RELAY_HOST=${MAIL_RELAY_HOST}
    #ports:
    #  - 8080:5000 #Webserver
    #  - 8000:8000 #AgentReceiver
    volumes:
      - monitoring:/omd/sites
      - ./checkmk/backups:/backups
    tmpfs:
      - /opt/omd/sites/${CMK_SITE_ID}/tmp:uid=1000,gid=1000
    networks:
      - backend


  checkmk_proxy:
    image: nginx:${PROXY_VERSION_TAG:-alpine}
    container_name: checkmk_proxy
    restart: unless-stopped
    ports:
      - "${PROXY_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - checkmk_app
    networks:
      - backend


# Necessario creare un named volume -> bind mount non disponibile a causa di presenza di file socket trattati diversamente tra Linux e Windows
volumes:
  monitoring:
    name: ${SITES_VOLUME_NAME}